<p>todo-list works!</p>


@if(users.isLoading()){
  <h2>Loading...</h2>
}

@if(users.error()){
  <h2>Something went wrong</h2>
}

<button (click)="todos.reload()">Reload</button>

<ul>
  @for(todo of todos.value();track todo.id){
    <li>{{todo.name}}</li>
  }@empty {
    <li>Nothing to show</li>
  }
</ul>
