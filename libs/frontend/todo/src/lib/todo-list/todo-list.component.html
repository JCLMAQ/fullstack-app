<ul>
  @let error = todos.error();
  @if (error) {
    <p>{{ error }}</p>
  }

  @if (todos.isLoading()) {
    <p>Loading todos...</p>
  }

@for (task of todos.value(); track task.id) {
  <li>{{task.title }} {{ task.id }}</li>
}  @empty {
  <p>No todos!</p>
}
</ul>
